name: pr-title

# Squash merges use the PR title as the commit message, which release-please
# reads to pick the next version — so the title must be a Conventional Commit.
# pull_request_target is safe here: nothing from the PR is checked out or run.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
