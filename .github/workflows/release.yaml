name: release

on:
  push:
    tags:
      - "v*"
  # Called by release-please: a tag it pushes with GITHUB_TOKEN can't
  # trigger the push event above.
  workflow_call:
    inputs:
      tag:
        description: Tag to build and publish
        required: true
        type: string
  # Re-publish an existing tag, e.g. after a failed run.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Opens a version-bump PR against krew-index from .krew.yaml. The bot
      # only updates plugins already in the index, so it stays off until the
      # initial submission is accepted (repo variable KREW_INDEX_PUBLISHED).
      - if: vars.KREW_INDEX_PUBLISHED == 'true'
        uses: rajatjindal/krew-release-bot@c970b8a8f6dbc2f2285a26e3ae160903b87002c3 # v0.0.51
        with:
          krew_plugin_release_tag: ${{ inputs.tag || github.ref_name }}
